name: Backfill reuniões TLDV (manual)

# Puxa as reuniões recentes do TLDV que ainda não estão na aba Reuniões do
# cliente e gera resumo+checklist retroativo (rota /api/integrations/tldv-backfill).
# SÓ manual (workflow_dispatch) — backfill não é rotina; a rotina é o pipeline
# tldv-sync → Make → webhook de resumo.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Quantas reuniões recentes olhar (1-20)'
        default: '10'
        required: false
      dry:
        description: 'Dry-run: só mostra o casamento título→cliente (1 = sim)'
        default: '0'
        required: false
      reatribuir:
        description: 'Corrigir atribuição: meeting_ids separados por vírgula'
        default: ''
        required: false
      cliente:
        description: 'Cliente destino da reatribuição (nome ou apelido)'
        default: ''
        required: false
      verificar:
        description: 'Auditoria: confere as gravadas contra a agenda (1 = sim)'
        default: '0'
        required: false

concurrency:
  group: tldv-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rodar backfill
        run: |
          SECRET="${{ secrets.ONMID_INTEGRATION_SECRET }}"
          if [ -z "$SECRET" ]; then
            echo "::error::Configure o secret ONMID_INTEGRATION_SECRET."
            exit 1
          fi

          HTTP_CODE=$(curl -s -G -o /tmp/resposta.json -w "%{http_code}" --max-time 300 \
            -H "x-onmid-secret: $SECRET" \
            --data-urlencode "limit=${{ inputs.limit }}" \
            --data-urlencode "dry=${{ inputs.dry }}" \
            --data-urlencode "reatribuir=${{ inputs.reatribuir }}" \
            --data-urlencode "cliente=${{ inputs.cliente }}" \
            --data-urlencode "verificar=${{ inputs.verificar }}" \
            "https://reports.onmid.app/api/integrations/tldv-backfill")
          echo "HTTP $HTTP_CODE"
          cat /tmp/resposta.json | python3 -m json.tool || cat /tmp/resposta.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::tldv-backfill retornou HTTP $HTTP_CODE"
            exit 1
          fi
          if grep -q '"ok":false' /tmp/resposta.json; then
            echo "::error::tldv-backfill respondeu ok:false"
            exit 1
          fi
