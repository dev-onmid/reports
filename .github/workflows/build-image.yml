name: Build da imagem (Coolify/VPS)

# Constrói a imagem Docker de produção FORA da VPS — os 2 núcleos de lá são
# compartilhados com a Evolution (WhatsApp de todos os clientes), então build
# na VPS está proibido por decisão de projeto (ver CLAUDE.md, saída da Vercel).
#
# O resultado sobe como ARTEFATO (.tar.gz) — sem registry, sem credencial nova.
# Quem publica baixa o artefato e faz `docker load` na VPS via SSH.
#
# ⚠️ Os valores NEXT_PUBLIC_* abaixo estão em claro DE PROPÓSITO: são assados no
# JavaScript do NAVEGADOR de qualquer forma (público por desenho — o painel do
# Supabase marca a publishable key como "safe to share publicly"). Segredo de
# servidor (senha de banco, chaves de API) NUNCA entra aqui — vai como variável
# de ambiente na hora de RODAR, no Coolify/VPS.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://iremmorsgwiqrorzoihx.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_2HGMnVTG4ZeBupx8l73U5w_k_Z3kauw \
            --build-arg NEXT_PUBLIC_APP_URL=https://reports.onmid.app \
            --build-arg NEXT_PUBLIC_BASE_URL=https://reports.onmid.app \
            -t onmid-reports:${GITHUB_SHA::8} .

      - name: Empacotar
        run: docker save onmid-reports:${GITHUB_SHA::8} | gzip > onmid-reports-image.tar.gz && ls -lh onmid-reports-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: onmid-reports-image
          path: onmid-reports-image.tar.gz
          retention-days: 7

      # ─────────────────────────────── PUBLICAR ────────────────────────────────
      # Antes daqui, "está na main" NÃO significava "está no ar": o build subia
      # como artefato e alguém precisava baixar, mandar por scp e rodar o script
      # na VPS à mão. Na prática o site ficava dias atrás do repositório.
      #
      # Este passo fecha essa lacuna e devolve o comportamento que a Vercel tinha:
      # push na main → no ar em poucos minutos.
      #
      # ⚠️ Só roda se os 3 segredos existirem. Sem eles o passo é PULADO e o
      # build continua verde — quem clonar o repo sem acesso à VPS não vê o
      # workflow falhando, e o deploy manual segue possível pelo artefato.
      - name: Publicar na VPS
        if: ${{ github.ref == 'refs/heads/main' && env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::8}"

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fixa a identidade do host: sem isso, StrictHostKeyChecking=no aceitaria
          # qualquer servidor que respondesse no IP.
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"

          echo "→ enviando imagem ($TAG)"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            onmid-reports-image.tar.gz "$VPS_USER@$VPS_HOST:/opt/onmid-reports/"

          echo "→ publicando"
          # deploy-recv.sh já vive na VPS: docker load + troca a tag no compose +
          # up -d + smoke test na porta local 3900. Se ele falhar, o `set -e` do
          # lado de lá devolve saída != 0 e este passo fica VERMELHO — é o que
          # impede um deploy quebrado passar despercebido.
          $SSH "$VPS_USER@$VPS_HOST" "cd /opt/onmid-reports && bash deploy-recv.sh $TAG"

          rm -f ~/.ssh/deploy_key

      - name: Conferir se o site respondeu
        if: ${{ github.ref == 'refs/heads/main' && env.VPS_HOST != '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # Smoke test de fora: o deploy-recv.sh testa a porta local 3900, mas só
          # isto prova que o Traefik está roteando o domínio para o container novo.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://reports.onmid.app/login || echo 000)
          echo "GET /login → $code"
          test "$code" = "200"
